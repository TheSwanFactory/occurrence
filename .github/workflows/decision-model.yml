name: claim decision-model on PyPI

on:
  push:
    branches:
      - sober-refactor
    paths:
      - ".github/workflows/decision-model.yml"

permissions:
  contents: read

jobs:
  claim:
    name: Publish decision-model 0.0.1 reservation
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build minimal reservation release
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("claim")
          package = root / "src" / "decision_model"
          package.mkdir(parents=True)
          (root / "pyproject.toml").write_text(
              """[build-system]
          requires = ["setuptools==80.9.0"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "decision-model"
          version = "0.0.1"
          description = "Typed decision-model contracts; initial namespace reservation."
          readme = "README.md"
          requires-python = ">=3.11"
          license = "MIT"
          authors = [{ name = "The Swan Factory" }]
          dependencies = []

          [project.urls]
          Source = "https://github.com/TheSwanFactory/occurrence"
          Issues = "https://github.com/TheSwanFactory/occurrence/issues"

          [tool.setuptools]
          package-dir = { "" = "src" }

          [tool.setuptools.packages.find]
          where = ["src"]
          include = ["decision_model*"]
          """,
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              """# decision-model

          Initial namespace reservation for The Swan Factory's Decision Model package.

          The stable 1.0 API is being prepared in
          [TheSwanFactory/occurrence](https://github.com/TheSwanFactory/occurrence).
          This 0.0.1 release intentionally exposes no stable behavior.
          """,
              encoding="utf-8",
          )
          (package / "__init__.py").write_text(
              '"""Initial decision-model namespace reservation; no stable API."""\n\n'
              '__version__ = "0.0.1"\n',
              encoding="utf-8",
          )
          PY
          uv build --project claim --out-dir claim/dist

      - name: Verify reservation artifacts
        run: |
          python - <<'PY'
          import email
          from pathlib import Path
          import zipfile

          dist = Path("claim/dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_name = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert metadata["Name"] == "decision-model"
              assert metadata["Version"] == "0.0.1"
              assert "decision_model/__init__.py" in names
          PY

      - name: Publish reservation with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: claim/dist/
