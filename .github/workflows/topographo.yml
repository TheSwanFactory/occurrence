name: topographo

# Build and test topographo once, publish that exact artifact after a forward
# version bump reaches main, and record successful releases with a tag/release.

on:
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the committed prerelease to TestPyPI
        required: false
        default: false
        type: boolean
      expected_version:
        description: Exact committed PEP 440 prerelease (for example, 0.4.3rc1)
        required: false
        type: string
      confirmation:
        description: Type publish-to-testpypi to authorize the test upload
        required: false
        type: string
  pull_request:
    paths:
      - "topographo/**"
      - "experiments/sedenion-machine/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/scripts/**"
      - ".github/workflows/topographo.yml"
  push:
    branches:
      - main
    paths:
      - "topographo/**"
      - "experiments/sedenion-machine/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/scripts/**"
      - ".github/workflows/topographo.yml"

permissions:
  contents: read

jobs:
  package:
    name: Build and test topographo
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    outputs:
      version: ${{ steps.release.outputs.version }}
      production_release: ${{ steps.release.outputs.production_release }}
      test_release: ${{ steps.release.outputs.test_release }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Check out repository with release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch default branch for prerelease dispatch comparison
        if: github.event_name == 'workflow_dispatch' && inputs.publish_prerelease
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          git fetch --no-tags origin
          "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check lockfile is in sync with pyproject.toml
        run: uv lock --check

      - name: Validate release metadata and decision
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          args=(
            validate-source
            --event-name "$EVENT_NAME"
            --ref "$EVENT_REF"
            --before "$EVENT_BEFORE"
            --base-sha "$BASE_SHA"
            --baseline-ref "refs/remotes/origin/${DEFAULT_BRANCH}"
            --expected-version "$EXPECTED_VERSION"
            --confirmation "$CONFIRMATION"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$PUBLISH_PRERELEASE" = "true" ]; then
            args+=(--publish-prerelease)
          fi
          uv run --frozen python .github/scripts/topographo_release.py "${args[@]}"

      - name: Run package tests
        run: uv run --frozen pytest topographo/tests

      - name: Verify exact sedenion experiment artifacts
        run: uv run --frozen python experiments/sedenion-machine/experiments.py --check

      - name: Verify importable package API
        run: |
          uv run --frozen python - <<'PY'
          from topographo.core import CayleyDicksonAlgebra, verify_gates
          from topographo.ssd import SedenionAlgebra, average_metric_operator, exact_machine
          from topographo.exceptional import Albert

          assert all(result.passed for result in verify_gates())
          assert CayleyDicksonAlgebra(8).dim == 8
          sedenions = SedenionAlgebra()
          assert average_metric_operator(sedenions, sedenions.sample_crack(4)).shape == (16, 16)
          assert exact_machine.mul(
              exact_machine.basis(1), exact_machine.basis(1)
          ) == exact_machine.scale(-1, exact_machine.one())
          import numpy as np
          assert Albert().det(np.array([2, 3, 5] + [0] * 24, float)) == 30.0
          PY

      - name: Verify isolated package install
        run: |
          uv pip install --target /tmp/topographo-install .
          cd /tmp
          PYTHONPATH=/tmp/topographo-install "${pythonLocation}/bin/python" - <<'PY'
          import topographo
          import topographo.exceptional
          from topographo.ssd import exact_machine

          assert hasattr(topographo, "CayleyDicksonAlgebra")
          assert hasattr(topographo.exceptional, "cayley_dickson_table")
          # topographo.exceptional reuses the core table; it carries no copy.
          assert topographo.exceptional.cayley_dickson_table is topographo.cayley_dickson_table
          assert exact_machine.DIMENSION == 16
          PY

      - name: Build distribution
        run: uv build

      - name: Verify built distribution metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: >-
          uv run --frozen python .github/scripts/topographo_release.py
          verify-dist --dist-dir dist --version "$VERSION"

      - name: Build API documentation
        run: |
          uv run --frozen pdoc \
            topographo \
            topographo.core \
            topographo.core.algebra \
            topographo.core.cayley_dickson \
            topographo.core.gates \
            topographo.ssd \
            topographo.ssd.channel \
            topographo.ssd.sedenion \
            topographo.exceptional \
            topographo.exceptional.lab \
            -o site

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: package
    if: >-
      needs.package.outputs.production_release == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    concurrency:
      group: topographo-pypi-release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/topographo/
    permissions:
      contents: read
      id-token: write
    outputs:
      preflight_passed: ${{ steps.preflight.outputs.preflight_passed }}
      upload_succeeded: ${{ steps.upload.outcome == 'success' }}

    steps:
      - name: Check out release support code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tested distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Verify artifact, tag, and PyPI availability
        id: preflight
        env:
          VERSION: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/topographo_release.py verify-dist --dist-dir dist --version "$VERSION"
          python .github/scripts/topographo_release.py check-tag --version "$VERSION" --commit "$RELEASE_COMMIT"
          python .github/scripts/topographo_release.py check-index --base-url https://pypi.org/pypi --version "$VERSION"
          echo "preflight_passed=true" >> "$GITHUB_OUTPUT"

      - name: Publish tested distributions to PyPI
        id: upload
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1

  reconcile-publish:
    name: Reconcile interrupted PyPI publication
    runs-on: ubuntu-latest
    needs:
      - package
      - publish
    if: >-
      always() &&
      needs.package.outputs.production_release == 'true' &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.preflight_passed == 'true' &&
      needs.publish.outputs.upload_succeeded != 'true'
    concurrency:
      group: topographo-pypi-release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/topographo/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release support code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tested distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Verify remote subset and prepare missing artifacts
        id: reconcile
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          python .github/scripts/reconcile_topographo_index.py prepare
          --base-url https://pypi.org/pypi
          --version "$VERSION"
          --dist-dir dist
          --missing-dir missing-dist
          --github-output "$GITHUB_OUTPUT"

      - name: Publish only verified missing artifacts
        if: steps.reconcile.outputs.has_missing == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: missing-dist/

      - name: Verify complete PyPI publication
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          python .github/scripts/reconcile_topographo_index.py verify
          --base-url https://pypi.org/pypi
          --version "$VERSION"
          --dist-dir dist

  test-publish:
    name: Publish prerelease to TestPyPI
    runs-on: ubuntu-latest
    needs: package
    if: >-
      needs.package.outputs.test_release == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_prerelease
    concurrency:
      group: topographo-testpypi-release
      cancel-in-progress: false
    environment:
      name: testpypi
      url: https://test.pypi.org/project/topographo/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release support code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tested distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Verify artifact and TestPyPI availability
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          python .github/scripts/topographo_release.py verify-dist --dist-dir dist --version "$VERSION"
          python .github/scripts/topographo_release.py check-index --base-url https://test.pypi.org/pypi --version "$VERSION"

      - name: Publish tested prerelease to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  release-record:
    name: Create release tag and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - package
      - publish
      - reconcile-publish
    if: >-
      always() &&
      needs.package.outputs.production_release == 'true' &&
      needs.publish.result == 'success' &&
      (needs.publish.outputs.upload_succeeded == 'true' ||
       needs.reconcile-publish.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Check out published commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download published distribution artifacts
        uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist

      - name: Verify or create release tag
        id: tag
        env:
          VERSION: ${{ needs.package.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python .github/scripts/topographo_release.py check-tag \
            --version "$VERSION" \
            --commit "$RELEASE_COMMIT" \
            --github-output "$GITHUB_OUTPUT"
          if [ "$(grep '^tag_exists=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" != "true" ]; then
            git tag "v${VERSION}" "$RELEASE_COMMIT"
            if ! git push origin "refs/tags/v${VERSION}"; then
              python .github/scripts/topographo_release.py check-tag \
                --version "$VERSION" --commit "$RELEASE_COMMIT"
            fi
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            args=(
              release create "$TAG" dist/*
              --verify-tag
              --generate-notes
              --title "topographo ${VERSION}"
            )
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

  pages:
    name: Publish API docs
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
